<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文档管理 · Markdown View</title>
<style>
:root{color-scheme:light;--ink:#163844;--muted:#647984;--accent:#176d80;--line:#d7e3e8}*{box-sizing:border-box}body{margin:0;background:#f3f7f8;color:var(--ink);font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}header{background:white;border-bottom:1px solid var(--line);padding:18px max(24px,calc((100vw - 1120px)/2));display:flex;justify-content:space-between;align-items:center}header strong{font-size:19px}a{color:var(--accent)}main{max-width:1120px;margin:36px auto;padding:0 24px}h1{font-size:30px;margin:0}h2{font-size:19px;margin:0 0 18px}p{color:var(--muted)}.grid{display:grid;grid-template-columns:340px 1fr;gap:24px;margin-top:28px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:24px;min-width:0}label{display:block;margin:16px 0 6px;font-weight:600}input,select{width:100%;padding:10px;border:1px solid #bbcdd5;border-radius:6px;font:inherit}button,.button{padding:9px 15px;border:1px solid var(--accent);border-radius:6px;background:var(--accent);color:white;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.5;cursor:wait}.secondary{background:white;color:var(--accent)}#upload{width:100%;margin-top:22px}small{display:block;color:var(--muted);margin-top:10px}#status{min-height:28px;margin:20px 0;white-space:pre-wrap}#status.error{color:#a93232}.row{padding:16px 0;border-bottom:1px solid var(--line)}.meta{color:var(--muted);font-size:13px;overflow-wrap:anywhere}.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.empty{padding:34px 0;color:var(--muted)}dialog{max-width:900px;width:90%;border:1px solid var(--line);border-radius:12px;padding:24px}dialog::backdrop{background:#16384466}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:65vh;overflow:auto;background:#f3f7f8;padding:18px}.dialog-head{display:flex;justify-content:space-between;align-items:center}@media(max-width:760px){.grid{grid-template-columns:1fr}main{margin-top:24px}.card{padding:18px}header{padding:16px 24px}}
</style></head><body><header><strong>M↓ &nbsp; Markdown View</strong><a href="/">返回阅读</a></header><main><h1>文档管理</h1><p>同步当前文档，保留每一次被替换的内容。</p><div class="grid"><section class="card"><h2>同步 Markdown</h2><form id="sync-form"><label for="source">选择文档</label><input id="source" type="file" accept=".md,text/markdown" required><label for="target">目标相对路径</label><input id="target" placeholder="例如：技术方案.md" required><small>默认使用原文件名。可指定已有子目录。同名文件自动覆盖，覆盖前保存历史版本；内容相同则跳过。仅支持 UTF-8，最大 8 MiB。</small><button id="upload" type="submit">同步并保存历史</button></form></section><section class="card"><h2>历史版本</h2><label for="document">选择文档</label><select id="document"><option value="">正在加载…</option></select><div id="versions" class="empty">选择文档查看历史。</div></section></div><div id="status" role="status" aria-live="polite"></div></main><dialog id="preview"><div class="dialog-head"><strong>历史内容（原文）</strong><button id="close" class="secondary">关闭</button></div><pre id="content"></pre></dialog><script>
const source=document.getElementById('source'),target=document.getElementById('target'),select=document.getElementById('document'),list=document.getElementById('versions'),status=document.getElementById('status'),upload=document.getElementById('upload');
function show(text,error=false){status.textContent=text;status.className=error?'error':''}
async function request(url,options={}){const r=await fetch(url,{...options,credentials:'same-origin',cache:'no-store'});if(r.status===401){location.replace('/login?next=/documents');throw Error('登录已过期')}if(!r.ok){let e;try{e=await r.json()}catch{}throw Error(e?.error||'请求失败')}return r}
function api(action,name,id){return '/api/documents/'+action+'?path='+encodeURIComponent(name)+(id?'&version='+encodeURIComponent(id):'')}
async function refresh(name){const r=await request('/files'),data=await r.json();select.replaceChildren(new Option('请选择文档',''));for(const f of data.list||[]){const p=f.path.replace(/^\//,'');select.add(new Option(p,p))}if(name)select.value=name;await history()}
async function history(){list.replaceChildren();if(!select.value){list.textContent='选择文档查看历史。';return}const name=select.value;const data=await(await request(api('history',name))).json();if(select.value!==name)return;if(!data.versions.length){list.textContent='还没有历史版本。下一次内容发生变化时，当前版本会自动保留。';return}for(const v of data.versions){const row=document.createElement('div');row.className='row';const title=document.createElement('strong');title.textContent=new Date(v.saved_at).toLocaleString('zh-CN',{hour12:false});const meta=document.createElement('div');meta.className='meta';meta.textContent=v.saved_by+' · '+v.size+' 字节 · SHA-256 '+v.sha256.slice(0,12);const actions=document.createElement('div');actions.className='actions';const view=document.createElement('button');view.className='secondary';view.textContent='查看';view.onclick=async()=>{try{document.getElementById('content').textContent=await(await request(api('version',name,v.id))).text();document.getElementById('preview').showModal()}catch(e){show(e.message,true)}};const download=document.createElement('a');download.className='button secondary';download.textContent='下载';download.href=api('version',name,v.id)+'&download=1';const restore=document.createElement('button');restore.textContent='恢复此版本';restore.onclick=async()=>{if(!confirm('恢复这个历史版本？当前内容会先保存到历史记录。'))return;restore.disabled=true;try{const result=await(await request(api('restore',name,v.id),{method:'POST'})).json();show(result.changed?'已恢复，恢复前的内容已保存。':'内容相同，无需恢复。');await history()}catch(e){show(e.message,true)}finally{restore.disabled=false}};actions.append(view,download,restore);row.append(title,meta,actions);list.append(row)}}
source.onchange=()=>{if(source.files[0])target.value=source.files[0].name};select.onchange=()=>history().catch(e=>show(e.message,true));document.getElementById('close').onclick=()=>document.getElementById('preview').close();
document.getElementById('sync-form').onsubmit=async event=>{event.preventDefault();const f=source.files[0];if(!f)return;if(f.size>8388608){show('文件超过 8 MiB。',true);return}upload.disabled=true;show('正在同步…');try{const name=target.value.trim();const result=await(await request(api('sync',name),{method:'PUT',headers:{'Content-Type':'text/markdown; charset=utf-8'},body:f})).json();show(result.changed?(result.previous_version?'已覆盖同名文件，旧版本已保存。':'文档已同步。'):'内容未变化，已跳过覆盖。');await refresh(name)}catch(e){show(e.message,true)}finally{upload.disabled=false}};
refresh().catch(e=>show(e.message,true));
</script></body></html>
